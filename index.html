<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Industrial Design Library</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #201f1e;
        --muted: #706a63;
        --paper: #fbfbfa;
        --card-radius: 16px;
        --serif: Georgia, "Times New Roman", serif;
        --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.95), transparent 34rem),
          linear-gradient(180deg, #fdfdfc 0%, var(--paper) 100%);
        color: var(--ink);
        font-family: var(--sans);
      }

      .page-shell {
        position: relative;
        min-height: 100vh;
        padding: 16px 24px 80px;
      }

      .mark {
        position: fixed;
        top: 16px;
        left: 24px;
        display: grid;
        grid-template-columns: repeat(2, 16px);
        grid-template-rows: repeat(2, 16px);
        overflow: hidden;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        filter: saturate(1.05);
      }

      .mark span:nth-child(1) {
        background: #151210;
      }

      .mark span:nth-child(2) {
        background: #fae0ca;
      }

      .mark span:nth-child(3) {
        background: #ffbf00;
      }

      .mark span:nth-child(4) {
        background: linear-gradient(135deg, #f1460b 0 50%, #0047ff 50%);
      }

      .login {
        position: fixed;
        top: 16px;
        right: 24px;
        border: 0;
        border-radius: 8px;
        padding: 7px 13px;
        background: #f4f4f3;
        color: #171615;
        font: 14px/1 var(--sans);
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding-top: 145px;
      }

      .intro-rule {
        width: 72px;
        height: 2px;
        margin-bottom: 28px;
        background: #dedbd6;
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(42px, 3.5vw, 50px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .dek {
        max-width: 420px;
        margin: 22px 0 0;
        color: #6c6259;
        font-size: 21px;
        line-height: 1.27;
        text-align: center;
      }

      .card-stage {
        position: relative;
        width: min(900px, 100vw - 32px);
        height: 550px;
        margin-top: 2px;
        isolation: isolate;
        perspective: 1100px;
      }

      .craft-card {
        --lift: 0px;
        --card-scale: 1;
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: var(--z);
        display: block;
        width: var(--w);
        height: var(--h);
        border: 0;
        border-radius: var(--card-radius);
        padding: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        transform:
          translate3d(calc(-50% + var(--x)), calc(-50% + var(--y) + var(--lift)), 0)
          rotate(var(--angle))
          scale(var(--card-scale));
        transform-origin: center;
        opacity: 1;
        scale: 1;
        translate: 0 0;
        animation:
          cardEnter 980ms cubic-bezier(0.16, 1, 0.28, 1) backwards,
          cardFloat 6.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        animation-delay: var(--delay), calc(var(--delay) + 1120ms);
        filter: drop-shadow(0 14px 18px rgba(27, 24, 20, 0.075));
        transition:
          width 620ms cubic-bezier(0.16, 1, 0.28, 1),
          height 620ms cubic-bezier(0.16, 1, 0.28, 1),
          filter 380ms ease,
          transform 620ms cubic-bezier(0.16, 1, 0.28, 1);
        -webkit-tap-highlight-color: transparent;
      }

      .craft-card:hover,
      .craft-card:focus-visible {
        --lift: -8px;
        --card-scale: 1.03;
        filter: drop-shadow(0 20px 22px rgba(27, 24, 20, 0.12));
        transform:
          translate3d(calc(-50% + var(--x)), calc(-50% + var(--y) + var(--lift)), 24px)
          rotate(var(--angle))
          scale(var(--card-scale));
      }

      .craft-card:focus-visible {
        outline: 3px solid rgba(19, 107, 255, 0.42);
        outline-offset: 8px;
      }

      .card-face {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(0, 0, 0, 0.015)),
          var(--bg);
      }

      .card-face::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.14), transparent 18% 74%, rgba(0, 0, 0, 0.06)),
          radial-gradient(circle at 30% 12%, rgba(255, 255, 255, 0.18), transparent 33%);
        mix-blend-mode: soft-light;
      }

      .card-art {
        position: absolute;
        left: var(--art-left);
        top: var(--art-top);
        width: var(--art-w);
        height: var(--art-h);
        overflow: hidden;
      }

      .card-title {
        position: absolute;
        left: var(--title-left);
        right: 20px;
        bottom: var(--title-bottom);
        margin: 0;
        font-family: var(--serif);
        font-size: 29px;
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: 0;
        text-align: left;
        transition:
          left 620ms cubic-bezier(0.16, 1, 0.28, 1),
          right 620ms cubic-bezier(0.16, 1, 0.28, 1),
          bottom 620ms cubic-bezier(0.16, 1, 0.28, 1),
          font-size 620ms cubic-bezier(0.16, 1, 0.28, 1);
      }

      .card-description {
        position: absolute;
        left: 24px;
        right: 34px;
        bottom: 54px;
        z-index: 1;
        margin: 0;
        color: currentColor;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.34;
        letter-spacing: 0;
        text-align: left;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 260ms ease,
          transform 420ms cubic-bezier(0.16, 1, 0.28, 1);
        transition-delay: 0ms;
      }

      .working .card-art {
        background:
          repeating-linear-gradient(
            83deg,
            transparent 0 7px,
            rgba(255, 255, 255, 0.88) 7px 9px,
            transparent 9px 13px
          );
        clip-path: polygon(
          0 0,
          100% 0,
          100% 100%,
          84% 96%,
          74% 70%,
          61% 88%,
          52% 44%,
          38% 95%,
          24% 55%,
          0 100%
        );
      }

      .working .card-art::before {
        content: "";
        position: absolute;
        inset: -10px 0 0;
        background:
          repeating-linear-gradient(
            92deg,
            transparent 0 11px,
            rgba(255, 238, 211, 0.74) 11px 13px,
            transparent 13px 17px
          );
        opacity: 0.8;
      }

      .demo .card-art {
        background:
          repeating-linear-gradient(0deg, rgba(44, 39, 33, 0.35) 0 10px, transparent 10px 13px),
          repeating-linear-gradient(90deg, rgba(44, 39, 33, 0.35) 0 10px, transparent 10px 13px);
      }

      .demo .card-art::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, transparent 0 35%, rgba(246, 235, 217, 0.9) 35% 39%, transparent 39% 61%, rgba(246, 235, 217, 0.9) 61% 65%, transparent 65%),
          linear-gradient(0deg, transparent 0 34%, rgba(246, 235, 217, 0.9) 34% 38%, transparent 38% 62%, rgba(246, 235, 217, 0.9) 62% 66%, transparent 66%);
        opacity: 0.72;
      }

      .ai .card-art {
        background:
          repeating-radial-gradient(
            ellipse at 50% -20%,
            rgba(236, 252, 255, 0.5) 0 1px,
            transparent 1px 7px
          );
      }

      .ai .card-art::before {
        content: "";
        position: absolute;
        inset: 6px 0 0;
        border-top: 2px solid rgba(235, 252, 255, 0.5);
        border-bottom: 2px solid rgba(235, 252, 255, 0.5);
        transform: skewY(-1.5deg);
        opacity: 0.55;
      }

      .methods .card-art {
        background:
          repeating-linear-gradient(90deg, rgba(15, 43, 35, 0.94) 0 3px, transparent 3px 6px),
          repeating-linear-gradient(0deg, rgba(15, 43, 35, 0.42) 0 2px, transparent 2px 7px);
      }

      .methods .card-art::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(90deg, transparent 0 17px, rgba(83, 243, 153, 0.7) 17px 20px),
          repeating-linear-gradient(0deg, transparent 0 18px, rgba(83, 243, 153, 0.7) 18px 22px);
      }

      .kit .card-art {
        border: 1px solid rgba(248, 237, 216, 0.18);
        background:
          repeating-linear-gradient(0deg, rgba(248, 237, 216, 0.08) 0 1px, transparent 1px 8px),
          repeating-linear-gradient(90deg, rgba(248, 237, 216, 0.08) 0 1px, transparent 1px 8px);
      }

      .kit .card-art::before,
      .kit .card-art::after {
        content: "";
        position: absolute;
        border: 2px solid rgba(248, 237, 216, 0.26);
        border-radius: 4px;
      }

      .kit .card-art::before {
        left: 10px;
        top: 12px;
        width: 168px;
        height: 76px;
      }

      .kit .card-art::after {
        left: 66px;
        top: 32px;
        width: 32px;
        height: 48px;
        box-shadow:
          40px 0 0 -2px rgba(33, 31, 30, 1),
          40px 0 0 0 rgba(248, 237, 216, 0.24),
          78px 0 0 -2px rgba(33, 31, 30, 1),
          78px 0 0 0 rgba(248, 237, 216, 0.24);
      }

      .working {
        --x: -300px;
        --y: 70px;
        --w: 266px;
        --h: 317px;
        --angle: -8deg;
        --z: 1;
        --delay: 90ms;
        --bg: #e54f10;
        --text: #fff5df;
        --art-left: 18px;
        --art-top: 18px;
        --art-w: 212px;
        --art-h: 146px;
        --title-left: 40px;
        --title-bottom: 20px;
      }

      .demo {
        --x: -147px;
        --y: 95px;
        --w: 248px;
        --h: 303px;
        --angle: 4deg;
        --z: 2;
        --delay: 180ms;
        --bg: #f6ebd9;
        --text: #2f2821;
        --art-left: 27px;
        --art-top: 17px;
        --art-w: 204px;
        --art-h: 133px;
        --title-left: 20px;
        --title-bottom: 25px;
      }

      .ai {
        --x: 0px;
        --y: 34px;
        --w: 238px;
        --h: 296px;
        --angle: -2deg;
        --z: 3;
        --delay: 270ms;
        --bg: #0a90d2;
        --text: #eefbff;
        --art-left: 17px;
        --art-top: 16px;
        --art-w: 200px;
        --art-h: 127px;
        --title-left: 25px;
        --title-bottom: 19px;
      }

      .methods {
        --x: 151px;
        --y: 95px;
        --w: 233px;
        --h: 292px;
        --angle: 1deg;
        --z: 4;
        --delay: 360ms;
        --bg: #53f399;
        --text: #12513a;
        --art-left: 18px;
        --art-top: 16px;
        --art-w: 198px;
        --art-h: 123px;
        --title-left: 18px;
        --title-bottom: 19px;
      }

      .kit {
        --x: 309px;
        --y: 62px;
        --w: 252px;
        --h: 307px;
        --angle: 5deg;
        --z: 5;
        --delay: 450ms;
        --bg: #211f1e;
        --text: #f5ead6;
        --art-left: 29px;
        --art-top: 17px;
        --art-w: 206px;
        --art-h: 137px;
        --title-left: 20px;
        --title-bottom: 26px;
      }

      .card-stage.has-active .craft-card {
        animation: none;
      }

      .card-stage.has-active .craft-card.is-selected {
        --x: 0px;
        --y: 35px;
        --w: 360px;
        --h: 464px;
        --angle: 0deg;
        --z: 10;
        --lift: 0px;
        --card-scale: 1;
        filter: drop-shadow(0 24px 28px rgba(27, 24, 20, 0.14));
      }

      .card-stage.has-active .craft-card.is-selected:hover,
      .card-stage.has-active .craft-card.is-selected:focus-visible {
        --lift: 0px;
        --card-scale: 1;
      }

      .card-stage.has-active .craft-card.is-minimized {
        --x: var(--collapsed-x);
        --y: 343px;
        --angle: var(--collapsed-angle);
        --z: var(--collapsed-z);
        --lift: 0px;
        --card-scale: 0.7;
        filter: drop-shadow(0 12px 14px rgba(27, 24, 20, 0.095));
      }

      .card-stage.has-active .craft-card.is-minimized:hover,
      .card-stage.has-active .craft-card.is-minimized:focus-visible {
        --lift: -10px;
        --card-scale: 0.74;
      }

      .card-stage.has-active .craft-card.is-selected .card-art {
        left: 24px;
        top: 26px;
        width: 312px;
        height: 190px;
      }

      .card-stage.has-active .craft-card.is-selected .card-title {
        left: 24px;
        right: 28px;
        bottom: 162px;
        font-size: 36px;
        line-height: 0.98;
      }

      .card-stage.has-active .craft-card.is-selected .card-description {
        opacity: 0.88;
        transform: translateY(0);
        transition-delay: 180ms;
      }

      .library-feed {
        width: min(1120px, 100% - 32px);
        margin: -44px auto 0;
        padding: 0 0 96px;
      }

      .feed-section {
        padding: 52px 0;
        border-top: 1px solid rgba(32, 31, 30, 0.12);
      }

      .feed-header {
        display: grid;
        grid-template-columns: minmax(0, 0.86fr) minmax(220px, 0.42fr);
        gap: 32px;
        align-items: end;
        margin-bottom: 22px;
      }

      .feed-eyebrow,
      .card-meta,
      .detail-kicker {
        margin: 0 0 10px;
        color: #8a8176;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .feed-title {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(30px, 3vw, 44px);
        font-weight: 500;
        line-height: 1;
      }

      .feed-summary {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .content-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .content-card {
        display: grid;
        min-height: 322px;
        overflow: hidden;
        border: 1px solid rgba(32, 31, 30, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.48);
        color: inherit;
        text-decoration: none;
      }

      .content-card:focus-visible {
        outline: 3px solid rgba(19, 107, 255, 0.42);
        outline-offset: 4px;
      }

      .cover-swatch {
        min-height: 154px;
        border-bottom: 1px solid rgba(32, 31, 30, 0.1);
      }

      .cover-swatch[data-cover="amber-aluminum"] {
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.34), transparent 42%),
          linear-gradient(120deg, #c86d2f 0 38%, #f5c474 38% 58%, #9aa0a3 58% 100%);
      }

      .cover-swatch[data-cover="foam-graphite"] {
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.38), transparent),
          repeating-linear-gradient(135deg, #b7c3d0 0 18px, #36404a 18px 22px, #d9dde0 22px 36px);
      }

      .cover-swatch[data-cover="soft-cream"] {
        background:
          radial-gradient(circle at 28% 30%, #fff5dc 0 18%, transparent 19%),
          linear-gradient(135deg, #f4e7cc, #b7ada1 48%, #f8f4ea);
      }

      .cover-swatch[data-cover="blue-grid"] {
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.2), transparent),
          repeating-linear-gradient(90deg, #0d6593 0 4px, #9ed7ef 4px 7px, #0d6593 7px 22px);
      }

      .cover-swatch[data-cover="ink-paper"] {
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.52), transparent),
          repeating-linear-gradient(0deg, #27221d 0 2px, #f2e7d2 2px 14px);
      }

      .content-card-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px;
      }

      .content-card h3 {
        margin: 0;
        font-family: var(--serif);
        font-size: 25px;
        font-weight: 500;
        line-height: 1.05;
      }

      .content-card p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.42;
      }

      .tag-row,
      .tag-index {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: auto;
      }

      .tag-pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        border: 1px solid rgba(32, 31, 30, 0.14);
        border-radius: 999px;
        padding: 3px 9px;
        color: #4f4942;
        font-size: 12px;
        line-height: 1;
      }

      .tag-index {
        padding: 18px;
        border: 1px solid rgba(32, 31, 30, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.48);
      }

      .route-panel {
        padding: 52px 0 96px;
        border-top: 1px solid rgba(32, 31, 30, 0.12);
      }

      .route-topline {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 34px;
      }

      .back-link {
        color: #4f4942;
        font-size: 14px;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .category-hero {
        max-width: 760px;
        margin-bottom: 34px;
      }

      .category-hero h2 {
        margin: 0 0 16px;
        font-family: var(--serif);
        font-size: clamp(42px, 6vw, 82px);
        font-weight: 500;
        line-height: 0.95;
      }

      .category-hero p {
        margin: 0;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.45;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 24px;
      }

      .detail-layout {
        display: grid;
        grid-template-columns: minmax(0, 0.72fr) minmax(240px, 0.28fr);
        gap: 40px;
        align-items: start;
      }

      .detail-main h2 {
        margin: 0 0 18px;
        font-family: var(--serif);
        font-size: clamp(44px, 6vw, 86px);
        font-weight: 500;
        line-height: 0.92;
      }

      .detail-summary {
        margin: 0 0 34px;
        color: var(--muted);
        font-size: 21px;
        line-height: 1.42;
      }

      .detail-cover {
        min-height: 340px;
        margin-bottom: 34px;
        overflow: hidden;
        border: 1px solid rgba(32, 31, 30, 0.12);
        border-radius: 8px;
      }

      .detail-cover .cover-swatch {
        display: block;
        min-height: inherit;
        border-bottom: 0;
      }

      .detail-section {
        padding: 28px 0;
        border-top: 1px solid rgba(32, 31, 30, 0.1);
      }

      .detail-section h3 {
        margin: 0 0 12px;
        font-family: var(--serif);
        font-size: 30px;
        font-weight: 500;
      }

      .detail-section p,
      .detail-section li {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
      }

      .detail-section ul {
        margin: 0;
        padding-left: 20px;
      }

      .detail-sidebar {
        position: sticky;
        top: 74px;
        border: 1px solid rgba(32, 31, 30, 0.12);
        border-radius: 8px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.58);
      }

      .detail-meta-list {
        display: grid;
        gap: 14px;
        margin: 0;
      }

      .detail-meta-list dt {
        color: #8a8176;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .detail-meta-list dd {
        margin: 4px 0 0;
        color: #37322d;
        font-size: 14px;
        line-height: 1.4;
      }

      @keyframes cardEnter {
        0% {
          opacity: 0;
          translate: 0 62px;
          scale: 0.965;
        }

        58% {
          opacity: 1;
        }

        100% {
          opacity: 1;
          translate: 0 0;
          scale: 1;
        }
      }

      @keyframes cardFloat {
        0%,
        100% {
          translate: 0 0;
        }

        50% {
          translate: 0 -5px;
        }
      }

      @media (max-width: 820px) {
        .page-shell {
          padding-inline: 16px;
        }

        .mark {
          left: 16px;
        }

        .login {
          right: 16px;
        }

        .hero {
          padding-top: 116px;
        }

        h1 {
          max-width: min(100%, 720px);
          white-space: normal;
          text-align: center;
        }

        .dek {
          max-width: 330px;
          font-size: 18px;
        }

        .card-stage {
          width: min(390px, 100vw - 20px);
          height: 420px;
          margin-top: 42px;
          transform: scale(0.72);
          transform-origin: top center;
        }

        .library-feed {
          width: min(100%, 100vw - 32px);
          margin-top: -24px;
        }

        .feed-header {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .content-grid {
          grid-template-columns: 1fr;
        }

        .detail-layout {
          grid-template-columns: 1fr;
        }

        .detail-sidebar {

      const sectionMeta = [

      const contentItems = [
        {
          title: "Modular Lamp Handle Study",

        },
        {

          summary: "A process note on checking visual weight, hand clearance, and tilt behavior before CAD details become too expensive.",
          cover: "foam-graphite",
          date: "2026-05-08",
          status: "published",
          tags: ["prototype", "ergonomics", "foam", "iteration"],
          materials: ["blue foam", "masking tape"],
          tools: ["utility knife", "calipers", "phone camera"],
          related: ["modular-lamp-handle-study"],
          body: "Fast foam checks made the lamp feel less precious and revealed that the first handle radius looked balanced in render but awkward in hand.",
          linkedWork: "modular-lamp-handle-study",
          stage: "prototype",
          question: "Does the handle invite pickup without making the lamp read as a lantern?",
          inputs: ["1:1 foam body", "three handle radii", "desk height photo pass"],

        {

          cover: "soft-cream",

          source: "Personal appliance reference board",
          sourceType: "product",
          whyItMatters: "Industrial products often need to look approachable without losing assembly clarity.",
          designObservation: "Large radii work best when paired with crisp part breaks and restrained surface texture.",
          applicableTo: ["home electronics", "lighting", "small tools"],
          imageCredits: "Use original photography or credited references before publishing.",
        },
        {
          title: "Parametric Vent Pattern Tests",
          slug: "parametric-vent-pattern-tests",
          category: "experiments",
          template: "experiment-log",
          summary: "A matrix of vent rhythms testing airflow cues, manufacturability, and visual quietness on small product housings.",
          cover: "blue-grid",
          date: "2026-05-04",
          status: "published",
          tags: ["parametric", "vent", "pattern", "manufacturing"],
          materials: ["anodized aluminum", "molded polymer"],
          tools: ["Grasshopper", "Rhino"],
          related: ["modular-lamp-handle-study"],
          body: "The most successful patterns reduced visual noise by grouping slots into bands rather than distributing them evenly across the full surface.",
          hypothesis: "Grouped vent rhythms can communicate performance while keeping small housings visually calm.",
          method: "Generate slot arrays with controlled spacing, radius, and density, then compare them at product scale.",
          variables: ["slot radius", "row spacing", "band density", "edge setback"],
          outputs: ["six pattern matrix", "two housing mockups", "manufacturing note"],
          evaluation: "Dense center bands looked intentional; evenly spaced grids looked generic and harder to align with part breaks.",
          reusableLearning: "Vent patterns should answer part geometry first and decoration second.",
        },
        {
          title: "Three-Pass Object Critique",
          slug: "three-pass-object-critique",
          category: "methods",
          template: "research-note",
          summary: "A reusable critique method for reading an object through silhouette, interaction, and manufacturing evidence.",
          cover: "ink-paper",
          date: "2026-05-01",
          status: "featured",
          tags: ["critique", "method", "design judgment", "research"],
          materials: [],
          tools: ["notebook", "camera"],
          related: ["soft-edge-appliance-references", "foam-model-balance-notes"],
          body: "The method separates first impression from use behavior and production evidence so critique does not collapse into taste too quickly.",
          topic: "Object critique",
          context: "Use this when reviewing references, competitors, prototypes, or finished products.",
          principle: "Read the object three times before deciding whether it works.",
          steps: ["Trace the silhouette", "Act out the interaction", "Find the manufacturing evidence"],
          example: "A desk lamp can look balanced in silhouette but fail the interaction pass if the adjustment point is visually hidden.",
          pitfalls: ["Judging only from render angles", "Treating CMF as separate from structure", "Skipping hand-scale checks"],
          templates: ["silhouette / interaction / evidence note grid"],
        },
      ];

      const homeView = document.querySelector("#home-view");
      const categoryView = document.querySelector("#category-view");
      const detailView = document.querySelector("#detail-view");

      function byDateDesc(items) {
        return [...items].sort((a, b) => getItemDate(b).localeCompare(getItemDate(a)));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function safeString(value, fallback = "") {
        if (value === undefined || value === null) {
          return fallback;
        }

        return String(value);
      }

      function getItemSlug(item) {
        return safeString(item.slug);
      }

      function getItemTitle(item) {
        return safeString(item.title, "Untitled Note");
      }

      function getItemSummary(item) {
        return safeString(item.summary);
      }

      function getItemCategory(item) {
        return safeString(item.category);
      }

      function getItemCover(item) {
        return safeString(item.cover);
      }

      function getItemDate(item) {
        return safeString(item.date);
      }

      function getItemMaterials(item) {
        return Array.isArray(item.materials) ? item.materials : [];
      }

      function getItemTags(item) {
        return Array.isArray(item.tags) ? item.tags : [];
      }

      function getItemsForModule(moduleName) {
        if (moduleName === "featuredWorks") {
          return contentItems.filter((item) => item.category === "works" && item.status === "featured").slice(0, 3);
        }

        if (moduleName === "recentNotes") {
          return byDateDesc(contentItems.filter((item) => item.category !== "works")).slice(0, 3);
        }

        if (moduleName === "cmfWatch") {
          return contentItems.filter((item) => getItemTags(item).includes("cmf") || getItemMaterials(item).length > 0).slice(0, 3);
        }

        if (moduleName === "studioExperiments") {
          return contentItems.filter((item) => item.category === "experiments").slice(0, 3);
        }

        return [];
      }

      function createTagPills(tags) {
        return tags.map((tag) => `<span class="tag-pill">${escapeHtml(safeString(tag))}</span>`).join("");
      }

      function createItemHref(item) {
        const slug = getItemSlug(item);

        return slug ? `#item/${slug}` : "#";
      }

      function createContentCard(item) {
        const cardMeta = [getItemCategory(item), getItemDate(item)].filter(Boolean).join(" / ");

        return `
          <a class="content-card" href="${escapeHtml(createItemHref(item))}" data-route="item" data-category="${escapeHtml(getItemCategory(item))}">
            <span class="cover-swatch" data-cover="${escapeHtml(getItemCover(item))}" aria-hidden="true"></span>
            <span class="content-card-body">
              <span class="card-meta">${escapeHtml(cardMeta)}</span>
              <h3>${escapeHtml(getItemTitle(item))}</h3>
              <p>${escapeHtml(getItemSummary(item))}</p>
              <span class="tag-row">${createTagPills(getItemTags(item).slice(0, 3))}</span>
            </span>
          </a>
        `;
      }

      function renderContentModule({ eyebrow, title, summary, items }) {
        return `
          <section class="feed-section">
            <div class="feed-header">
              <div>
                <p class="feed-eyebrow">${escapeHtml(eyebrow)}</p>
                <h2 class="feed-title">${escapeHtml(title)}</h2>
              </div>
              <p class="feed-summary">${escapeHtml(summary)}</p>
            </div>
            <div class="content-grid">
              ${items.map(createContentCard).join("")}
            </div>
          </section>
        `;
      }

      function renderTagIndex() {
        const tags = [...new Set(contentItems.flatMap(getItemTags))].sort();

        return `
          <section class="feed-section">
            <div class="feed-header">
              <div>
                <p class="feed-eyebrow">Reading the Index</p>
                <h2 class="feed-title">Browse by material, process, and design question.</h2>
              </div>
              <p class="feed-summary">Tags connect finished works to notes, experiments, references, and methods.</p>
            </div>
            <div class="tag-index">
              ${createTagPills(tags)}
            </div>
          </section>
        `;
      }

      function renderHome() {
        homeView.innerHTML = [
          renderContentModule({
            eyebrow: "Featured Works",
            title: "Portfolio-level studies with the process still visible.",
            summary: "Selected finished work anchors the library and gives visitors a fast read on design range.",
            items: getItemsForModule("featuredWorks"),
          }),
          renderContentModule({
            eyebrow: "Recent Notes",
            title: "Fresh observations from the studio notebook.",
            summary: "Process, inspiration, and methods stay close to the work instead of hiding behind finished images.",
            items: getItemsForModule("recentNotes"),
          }),
          renderContentModule({
            eyebrow: "Material / CMF Watch",
            title: "Surfaces, finishes, and material signals worth revisiting.",
            summary: "A compact lens on industrial design details that often decide whether an object feels resolved.",
            items: getItemsForModule("cmfWatch"),
          }),
          renderContentModule({
            eyebrow: "Studio Experiments",
            title: "Small trials that test form, structure, and interaction.",
            summary: "The experiment log keeps unfinished ideas useful by naming the hypothesis and result.",
            items: getItemsForModule("studioExperiments"),
          }),
          renderTagIndex(),
        ].join("");
      }

      function getSection(category) {
        return sectionMeta.find((section) => section.category === category);
      }

      function getItem(slug) {
        return contentItems.find((item) => getItemSlug(item) === slug);
      }

      function getRelatedSections(category) {
        return sectionMeta.filter((section) => section.category !== category).slice(0, 4);
      }

      function createCategoryHref(category) {
        return `#category/${category}`;
      }

      function renderList(values) {
        if (!Array.isArray(values) || values.length === 0) {
          return "";
        }

        return `<ul>${values.map((value) => `<li>${escapeHtml(safeString(value))}</li>`).join("")}</ul>`;
      }

      function renderDetailSection(title, body) {
        if (!body) {
          return "";
        }

        return `
          <section class="detail-section">
            <h3>${escapeHtml(title)}</h3>
            ${body}
          </section>
        `;
      }

      function renderParagraphSection(title, value) {
        if (!value) {
          return "";
        }

        return renderDetailSection(title, `<p>${escapeHtml(value)}</p>`);
      }

      function renderListSection(title, values) {
        return renderDetailSection(title, renderList(values));
      }

      function renderMetaList(item) {
        const meta = [
          ["Category", getSection(getItemCategory(item))?.title || getItemCategory(item)],
          ["Status", safeString(item.status)],
          ["Date", getItemDate(item)],
          ["Tags", getItemTags(item).join(", ")],
          ["Materials", getItemMaterials(item).join(", ")],
          ["Tools", Array.isArray(item.tools) ? item.tools.join(", ") : ""],
          ["Role", safeString(item.role)],
          ["Year", safeString(item.year)],
          ["Duration", safeString(item.duration)],
          ["Stage", safeString(item.stage)],
        ].filter(([, value]) => value);

        return `
          <dl class="detail-meta-list">
            ${meta.map(([label, value]) => `
              <div>
                <dt>${escapeHtml(label)}</dt>
                <dd>${escapeHtml(value)}</dd>
              </div>
            `).join("")}
          </dl>
        `;
      }

      function renderDetailShell(item, templateLabel, mainContent) {
        const category = getItemCategory(item);
        const section = getSection(category);
        const backHref = category ? createCategoryHref(category) : "#";
        const backLabel = section?.title || "Library";

        return `
          <article class="route-panel detail-layout" aria-labelledby="detail-title">
            <div class="detail-main">
              <div class="route-topline">
                <a class="back-link" href="${escapeHtml(backHref)}">Back to ${escapeHtml(backLabel)}</a>
                <span class="feed-eyebrow">${escapeHtml(templateLabel)}</span>
              </div>
              <h2 id="detail-title">${escapeHtml(getItemTitle(item))}</h2>
              <p class="detail-summary">${escapeHtml(getItemSummary(item))}</p>
              <div class="detail-cover">
                <span class="cover-swatch" data-cover="${escapeHtml(getItemCover(item))}" aria-hidden="true"></span>
              </div>
              ${mainContent}
            </div>
            <aside class="detail-sidebar" aria-label="Item details">
              ${renderMetaList(item)}
            </aside>
          </article>
        `;
      }

      function renderCaseStudy(item) {
        const mainContent = [
          renderParagraphSection("Brief", item.brief),
          renderParagraphSection("Problem", item.problem),
          renderParagraphSection("Outcome", item.outcome),
          renderParagraphSection("Studio Note", item.body),
          renderListSection("Process Highlights", item.processHighlights),
          renderListSection("Gallery", item.gallery),
          renderParagraphSection("Reflection", item.reflection),
        ].join("");

        return renderDetailShell(item, "Case Study", mainContent);
      }

      function renderResearchNote(item) {
        const mainContent = [
          renderParagraphSection("Context", item.context || item.source || item.linkedWork),
          renderParagraphSection("Question", item.question),
          renderParagraphSection("Why It Matters", item.whyItMatters),
          renderParagraphSection("Observation", item.designObservation || item.principle),
          renderParagraphSection("Notebook", item.body),
          renderListSection("Inputs", item.inputs),
          renderListSection("Iterations", item.iterations),
          renderListSection("Steps", item.steps),
          renderListSection("Pitfalls", item.pitfalls),
          renderListSection("Templates", item.templates),
          renderParagraphSection("Decision", item.decision),
          renderParagraphSection("Next Step", item.nextStep),
          renderParagraphSection("Example", item.example),
          renderParagraphSection("Credits", item.imageCredits),
        ].join("");

        return renderDetailShell(item, "Research Note", mainContent);
      }

      function renderExperimentLog(item) {
        const mainContent = [
          renderParagraphSection("Hypothesis", item.hypothesis),
          renderParagraphSection("Method", item.method),
          renderParagraphSection("Notebook", item.body),
          renderListSection("Variables", item.variables),
          renderListSection("Outputs", item.outputs),
          renderParagraphSection("Evaluation", item.evaluation),
          renderParagraphSection("Reusable Learning", item.reusableLearning),
        ].join("");

        return renderDetailShell(item, "Experiment Log", mainContent);
      }

      function renderDetail(slug) {
        const item = getItem(slug);

        if (!item) {
          return "";
        }

        if (item.template === "case-study") {
          return renderCaseStudy(item);
        }

        if (item.template === "experiment-log") {
          return renderExperimentLog(item);
        }

        return renderResearchNote(item);
      }

      function renderCategory(category) {
        const section = getSection(category);

        if (!section) {
          return "";
        }

        const items = byDateDesc(contentItems.filter((item) => item.category === category));
        const tags = [...new Set(items.flatMap(getItemTags))].sort();
        const relatedSections = getRelatedSections(category);

        return `
          <section class="route-panel" aria-labelledby="category-title">
            <div class="route-topline">
              <a class="back-link" href="#">Back to Library</a>
              <span class="feed-eyebrow">${escapeHtml(section.eyebrow)}</span>
            </div>
            <div class="category-hero">
              <h2 id="category-title">${escapeHtml(section.title)}</h2>
              <p>${escapeHtml(section.summary)}</p>
            </div>
            <div class="filter-row" aria-label="Category tags">
              ${createTagPills(tags)}
            </div>
            <div class="content-grid">
              ${items.map(createContentCard).join("")}
            </div>
            <section class="feed-section" aria-labelledby="related-sections-title">
              <div class="feed-header">
                <div>
                  <p class="feed-eyebrow">Related Sections</p>
                  <h2 class="feed-title" id="related-sections-title">Keep following the thread.</h2>
                </div>
                <p class="feed-summary">Move laterally between finished work, process records, references, experiments, and reusable methods.</p>
              </div>
              <div class="tag-index">
                ${relatedSections.map((related) => `
                  <a class="tag-pill" data-route="category" href="${escapeHtml(createCategoryHref(related.category))}">
                    ${escapeHtml(related.title)}
                  </a>
                `).join("")}
              </div>
            </section>
          </section>
        `;
      }

      function showHomeView() {
        homeView.hidden = false;
        categoryView.hidden = true;
        detailView.hidden = true;
      }

      function showCategoryView(category) {
        const section = getSection(category);

        if (!section) {
          showHomeView();
          return;
        }

        categoryView.innerHTML = renderCategory(category);
        homeView.hidden = true;
        categoryView.hidden = false;
        detailView.hidden = true;
      }

      function showDetailView(slug) {
        const detailHtml = renderDetail(slug);

        if (!detailHtml) {
          detailView.innerHTML = "";
          showHomeView();
          return;
        }

        detailView.innerHTML = detailHtml;
        homeView.hidden = true;
        categoryView.hidden = true;
        detailView.hidden = false;
      }

      function renderRoute() {
        const hash = window.location.hash.replace(/^#/, "");

        if (hash.startsWith("category/")) {
          showCategoryView(hash.replace("category/", ""));
          return;
        }

        if (hash.startsWith("item/")) {
          showDetailView(hash.replace("item/", ""));
          return;
        }

        showHomeView();
      }

      function navigateToCategory(category) {
        window.location.hash = `category/${category}`;
      }

      const collapsedSlots = [
        { x: -92, angle: "-4deg", z: 1 },
        { x: -38, angle: "-2deg", z: 2 },
        { x: 60, angle: "2deg", z: 4 },
        { x: 106, angle: "3deg", z: 5 },
      ];

      function clearActiveCard() {
        delete stage.dataset.activeIndex;
        stage.classList.remove("has-active");

        cards.forEach((card) => {
          card.classList.remove("is-selected", "is-minimized");
          card.removeAttribute("data-collapsed-x");
          card.setAttribute("aria-pressed", "false");
        });
      }

      function setActiveCard(activeIndex) {
        const currentIndex = stage.dataset.activeIndex;

        if (currentIndex === String(activeIndex)) {
          navigateToCategory(cards[activeIndex].dataset.category);
          return;
        }

        stage.dataset.activeIndex = String(activeIndex);
        stage.classList.add("has-active");

        let slotIndex = 0;

        cards.forEach((card, index) => {
          card.classList.remove("is-selected", "is-minimized");

          if (index === activeIndex) {
            card.classList.add("is-selected");
            card.setAttribute("aria-pressed", "true");
            return;
          }

          const slot = collapsedSlots[slotIndex];
          card.classList.add("is-minimized");
          card.dataset.collapsedX = String(slot.x);
          card.style.setProperty("--collapsed-x", `${slot.x}px`);
          card.style.setProperty("--collapsed-angle", slot.angle);
          card.style.setProperty("--collapsed-z", String(slot.z));
          card.setAttribute("aria-pressed", "false");
          slotIndex += 1;
        });
      }

      cards.forEach((card, index) => {
        card.setAttribute("aria-pressed", "false");
        card.addEventListener("click", () => setActiveCard(index));
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          clearActiveCard();
        }
      });

      renderHome();
      window.addEventListener("hashchange", renderRoute);
      renderRoute();
    </script>
  </body>
</html>
