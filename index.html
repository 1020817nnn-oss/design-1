<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Industrial Design Library</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #201f1e;
        --muted: #706a63;
        --paper: #fbfbfa;
        --card-radius: 16px;
        --serif: Georgia, "Times New Roman", serif;
        --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.95), transparent 34rem),
          linear-gradient(180deg, #fdfdfc 0%, var(--paper) 100%);
        color: var(--ink);
        font-family: var(--sans);
      }

      .page-shell {
        position: relative;
        min-height: 100vh;
        padding: 16px 24px 80px;
      }

      .mark {
        position: fixed;
        top: 16px;
        left: 24px;
        display: grid;
        grid-template-columns: repeat(2, 16px);
        grid-template-rows: repeat(2, 16px);
        overflow: hidden;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        filter: saturate(1.05);
      }

      .mark span:nth-child(1) {
        background: #151210;
      }

      .mark span:nth-child(2) {
        background: #fae0ca;
      }

      .mark span:nth-child(3) {
        background: #ffbf00;
      }

      .mark span:nth-child(4) {
        background: linear-gradient(135deg, #f1460b 0 50%, #0047ff 50%);
      }

      .login {
        position: fixed;
        top: 16px;
        right: 24px;
        border: 0;
        border-radius: 8px;
        padding: 7px 13px;
        background: #f4f4f3;
        color: #171615;
        font: 14px/1 var(--sans);
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding-top: 145px;
      }

      .intro-rule {
        width: 72px;
        height: 2px;
        margin-bottom: 28px;
        background: #dedbd6;
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(42px, 3.5vw, 50px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .dek {
        max-width: 420px;
        margin: 22px 0 0;
        color: #6c6259;
        font-size: 21px;
        line-height: 1.27;
        text-align: center;
      }

      .card-stage {
        position: relative;
        width: min(900px, 100vw - 32px);
        height: 550px;
        margin-top: 2px;
        isolation: isolate;
        perspective: 1100px;
      }

      .craft-card {
        --lift: 0px;
        --card-scale: 1;
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: var(--z);
        display: block;
        width: var(--w);
        height: var(--h);
        border: 0;
        border-radius: var(--card-radius);
        padding: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        transform:
          translate3d(calc(-50% + var(--x)), calc(-50% + var(--y) + var(--lift)), 0)
          rotate(var(--angle))
          scale(var(--card-scale));
        transform-origin: center;
        opacity: 1;
        scale: 1;
        translate: 0 0;
        animation:
          cardEnter 980ms cubic-bezier(0.16, 1, 0.28, 1) backwards,
          cardFloat 6.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        animation-delay: var(--delay), calc(var(--delay) + 1120ms);
        filter: drop-shadow(0 14px 18px rgba(27, 24, 20, 0.075));
        transition:
          width 620ms cubic-bezier(0.16, 1, 0.28, 1),
          height 620ms cubic-bezier(0.16, 1, 0.28, 1),
          filter 380ms ease,
          transform 620ms cubic-bezier(0.16, 1, 0.28, 1);
        -webkit-tap-highlight-color: transparent;
      }

      .craft-card:hover,
      .craft-card:focus-visible {
        --lift: -8px;
        --card-scale: 1.03;
        filter: drop-shadow(0 20px 22px rgba(27, 24, 20, 0.12));
        transform:
          translate3d(calc(-50% + var(--x)), calc(-50% + var(--y) + var(--lift)), 24px)
          rotate(var(--angle))
          scale(var(--card-scale));
      }

      .craft-card:focus-visible {
        outline: 3px solid rgba(19, 107, 255, 0.42);
        outline-offset: 8px;
      }

      .card-face {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(0, 0, 0, 0.015)),
          var(--bg);
      }

      .card-face::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.14), transparent 18% 74%, rgba(0, 0, 0, 0.06)),
          radial-gradient(circle at 30% 12%, rgba(255, 255, 255, 0.18), transparent 33%);
        mix-blend-mode: soft-light;
      }

      .card-art {
        position: absolute;
        left: var(--art-left);
        top: var(--art-top);
        width: var(--art-w);
        height: var(--art-h);
        overflow: hidden;
      }

      .card-title {
        position: absolute;
        left: var(--title-left);
        right: 20px;
        bottom: var(--title-bottom);
        margin: 0;
        font-family: var(--serif);
        font-size: 29px;
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: 0;
        text-align: left;
        transition:
          left 620ms cubic-bezier(0.16, 1, 0.28, 1),
          right 620ms cubic-bezier(0.16, 1, 0.28, 1),
          bottom 620ms cubic-bezier(0.16, 1, 0.28, 1),
          font-size 620ms cubic-bezier(0.16, 1, 0.28, 1);
      }

      .card-description {
        position: absolute;
        left: 24px;
        right: 34px;
        bottom: 54px;
        z-index: 1;
        margin: 0;
        color: currentColor;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.34;
        letter-spacing: 0;
        text-align: left;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 260ms ease,
          transform 420ms cubic-bezier(0.16, 1, 0.28, 1);
        transition-delay: 0ms;
      }

      .working .card-art {
        background:
          repeating-linear-gradient(
            83deg,
            transparent 0 7px,
            rgba(255, 255, 255, 0.88) 7px 9px,
            transparent 9px 13px
          );
        clip-path: polygon(
          0 0,
          100% 0,
          100% 100%,
          84% 96%,
          74% 70%,
          61% 88%,
          52% 44%,
          38% 95%,
          24% 55%,
          0 100%
        );
      }

      .working .card-art::before {
        content: "";
        position: absolute;
        inset: -10px 0 0;
        background:
          repeating-linear-gradient(
            92deg,
            transparent 0 11px,
            rgba(255, 238, 211, 0.74) 11px 13px,
            transparent 13px 17px
          );
        opacity: 0.8;
      }

      .demo .card-art {
        background:
          repeating-linear-gradient(0deg, rgba(44, 39, 33, 0.35) 0 10px, transparent 10px 13px),
          repeating-linear-gradient(90deg, rgba(44, 39, 33, 0.35) 0 10px, transparent 10px 13px);
      }

      .demo .card-art::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, transparent 0 35%, rgba(246, 235, 217, 0.9) 35% 39%, transparent 39% 61%, rgba(246, 235, 217, 0.9) 61% 65%, transparent 65%),
          linear-gradient(0deg, transparent 0 34%, rgba(246, 235, 217, 0.9) 34% 38%, transparent 38% 62%, rgba(246, 235, 217, 0.9) 62% 66%, transparent 66%);
        opacity: 0.72;
      }

      .ai .card-art {
        background:
          repeating-radial-gradient(
            ellipse at 50% -20%,
            rgba(236, 252, 255, 0.5) 0 1px,
            transparent 1px 7px
          );
      }

      .ai .card-art::before {
        content: "";
        position: absolute;
        inset: 6px 0 0;
        border-top: 2px solid rgba(235, 252, 255, 0.5);
        border-bottom: 2px solid rgba(235, 252, 255, 0.5);
        transform: skewY(-1.5deg);
        opacity: 0.55;
      }

      .methods .card-art {
        background:
          repeating-linear-gradient(90deg, rgba(15, 43, 35, 0.94) 0 3px, transparent 3px 6px),
          repeating-linear-gradient(0deg, rgba(15, 43, 35, 0.42) 0 2px, transparent 2px 7px);
      }

      .methods .card-art::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(90deg, transparent 0 17px, rgba(83, 243, 153, 0.7) 17px 20px),
          repeating-linear-gradient(0deg, transparent 0 18px, rgba(83, 243, 153, 0.7) 18px 22px);
      }

      .kit .card-art {
        border: 1px solid rgba(248, 237, 216, 0.18);
        background:
          repeating-linear-gradient(0deg, rgba(248, 237, 216, 0.08) 0 1px, transparent 1px 8px),
          repeating-linear-gradient(90deg, rgba(248, 237, 216, 0.08) 0 1px, transparent 1px 8px);
      }

      .kit .card-art::before,
      .kit .card-art::after {
        content: "";
        position: absolute;
        border: 2px solid rgba(248, 237, 216, 0.26);
        border-radius: 4px;
      }

      .kit .card-art::before {
        left: 10px;
        top: 12px;
        width: 168px;
        height: 76px;
      }

      .kit .card-art::after {
        left: 66px;
        top: 32px;
        width: 32px;
        height: 48px;
        box-shadow:
          40px 0 0 -2px rgba(33, 31, 30, 1),
          40px 0 0 0 rgba(248, 237, 216, 0.24),
          78px 0 0 -2px rgba(33, 31, 30, 1),
          78px 0 0 0 rgba(248, 237, 216, 0.24);
      }

      .working {
        --x: -300px;
        --y: 70px;
        --w: 266px;
        --h: 317px;
        --angle: -8deg;
        --z: 1;
        --delay: 90ms;
        --bg: #e54f10;
        --text: #fff5df;
        --art-left: 18px;
        --art-top: 18px;
        --art-w: 212px;
        --art-h: 146px;
        --title-left: 40px;
        --title-bottom: 20px;
      }

      .demo {
        --x: -147px;
        --y: 95px;
        --w: 248px;
        --h: 303px;
        --angle: 4deg;
        --z: 2;
        --delay: 180ms;
        --bg: #f6ebd9;
        --text: #2f2821;
        --art-left: 27px;
        --art-top: 17px;
        --art-w: 204px;
        --art-h: 133px;
        --title-left: 20px;
        --title-bottom: 25px;
      }

      .ai {
        --x: 0px;
        --y: 34px;
        --w: 238px;
        --h: 296px;
        --angle: -2deg;
        --z: 3;
        --delay: 270ms;
        --bg: #0a90d2;
        --text: #eefbff;
        --art-left: 17px;
        --art-top: 16px;
        --art-w: 200px;
        --art-h: 127px;
        --title-left: 25px;
        --title-bottom: 19px;
      }

      .methods {
        --x: 151px;
        --y: 95px;
        --w: 233px;
        --h: 292px;
        --angle: 1deg;
        --z: 4;
        --delay: 360ms;
        --bg: #53f399;
        --text: #12513a;
        --art-left: 18px;
        --art-top: 16px;
        --art-w: 198px;
        --art-h: 123px;
        --title-left: 18px;
        --title-bottom: 19px;
      }

      .kit {
        --x: 309px;
        --y: 62px;
        --w: 252px;
        --h: 307px;
        --angle: 5deg;
        --z: 5;
        --delay: 450ms;
        --bg: #211f1e;
        --text: #f5ead6;
        --art-left: 29px;
        --art-top: 17px;
        --art-w: 206px;
        --art-h: 137px;
        --title-left: 20px;
        --title-bottom: 26px;
      }

      .card-stage.has-active .craft-card {
        animation: none;
      }

      .card-stage.has-active .craft-card.is-selected {
        --x: 0px;
        --y: 35px;
        --w: 360px;
        --h: 464px;
        --angle: 0deg;
        --z: 10;
        --lift: 0px;
        --card-scale: 1;
        filter: drop-shadow(0 24px 28px rgba(27, 24, 20, 0.14));
      }

      .card-stage.has-active .craft-card.is-selected:hover,
      .card-stage.has-active .craft-card.is-selected:focus-visible {
        --lift: 0px;
        --card-scale: 1;
      }

      .card-stage.has-active .craft-card.is-minimized {
        --x: var(--collapsed-x);
        --y: 343px;
        --angle: var(--collapsed-angle);
        --z: var(--collapsed-z);
        --lift: 0px;
        --card-scale: 0.7;
        filter: drop-shadow(0 12px 14px rgba(27, 24, 20, 0.095));
      }

      .card-stage.has-active .craft-card.is-minimized:hover,
      .card-stage.has-active .craft-card.is-minimized:focus-visible {
        --lift: -10px;
        --card-scale: 0.74;
      }

      .card-stage.has-active .craft-card.is-selected .card-art {
        left: 24px;
        top: 26px;
        width: 312px;
        height: 190px;
      }

      .card-stage.has-active .craft-card.is-selected .card-title {
        left: 24px;
        right: 28px;
        bottom: 162px;
        font-size: 36px;
        line-height: 0.98;
      }

      .card-stage.has-active .craft-card.is-selected .card-description {
        opacity: 0.88;
        transform: translateY(0);
        transition-delay: 180ms;
      }

      @keyframes cardEnter {
        0% {
          opacity: 0;
          translate: 0 62px;
          scale: 0.965;
        }

        58% {
          opacity: 1;
        }

        100% {
          opacity: 1;
          translate: 0 0;
          scale: 1;
        }
      }

      @keyframes cardFloat {
        0%,
        100% {
          translate: 0 0;
        }

        50% {
          translate: 0 -5px;
        }
      }

      @media (max-width: 820px) {
        .page-shell {
          padding-inline: 16px;
        }

        .mark {
          left: 16px;
        }

        .login {
          right: 16px;
        }

        .hero {
          padding-top: 116px;
        }

        .dek {
          max-width: 330px;
          font-size: 18px;
        }

        .card-stage {
          width: min(390px, 100vw - 20px);
          height: 420px;
          margin-top: 42px;
          transform: scale(0.72);
          transform-origin: top center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .craft-card {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <div class="mark" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <button class="login" type="button">Login</button>

      <section class="hero" aria-labelledby="page-title">
        <div class="intro-rule" aria-hidden="true"></div>
        <h1 id="page-title">Industrial Design Library</h1>
        <p class="dek">
          A curated working library for industrial design studies, references, experiments, and finished work.
        </p>

        <div class="card-stage" aria-label="Industrial design library sections">
          <button class="craft-card working" type="button" aria-label="Works" data-category="works">
            <span class="card-face">
              <span class="card-art" aria-hidden="true"></span>
              <span class="card-title">Works</span>
              <span class="card-description">
                Finished projects, formal case studies, and portfolio-ready industrial design work.
              </span>
            </span>
          </button>

          <button class="craft-card demo" type="button" aria-label="Process" data-category="process">
            <span class="card-face">
              <span class="card-art" aria-hidden="true"></span>
              <span class="card-title">Process</span>
              <span class="card-description">
                Research, sketches, CAD decisions, prototypes, tests, and iteration records from the studio bench.
              </span>
            </span>
          </button>

          <button class="craft-card ai" type="button" aria-label="Inspiration" data-category="inspiration">
            <span class="card-face">
              <span class="card-art" aria-hidden="true"></span>
              <span class="card-title">Inspiration</span>
              <span class="card-description">
                Product observations, material references, structures, exhibitions, brands, and trend notes worth keeping.
              </span>
            </span>
          </button>

          <button class="craft-card methods" type="button" aria-label="Experiments" data-category="experiments">
            <span class="card-face">
              <span class="card-art" aria-hidden="true"></span>
              <span class="card-title">Experiments</span>
              <span class="card-description">
                Concepts, AI-assisted studies, parametric trials, CMF tests, and unfinished ideas with useful signals.
              </span>
            </span>
          </button>

          <button class="craft-card kit" type="button" aria-label="Methods" data-category="methods">
            <span class="card-face">
              <span class="card-art" aria-hidden="true"></span>
              <span class="card-title">Methods</span>
              <span class="card-description">
                Reusable design methods, toolchain notes, manufacturing lessons, and judgment frameworks.
              </span>
            </span>
          </button>
        </div>
      </section>
    </main>
    <script>
      const stage = document.querySelector(".card-stage");
      const cards = [...document.querySelectorAll(".craft-card")];
      const collapsedSlots = [
        { x: -92, angle: "-4deg", z: 1 },
        { x: -38, angle: "-2deg", z: 2 },
        { x: 60, angle: "2deg", z: 4 },
        { x: 106, angle: "3deg", z: 5 },
      ];

      function clearActiveCard() {
        delete stage.dataset.activeIndex;
        stage.classList.remove("has-active");

        cards.forEach((card) => {
          card.classList.remove("is-selected", "is-minimized");
          card.removeAttribute("data-collapsed-x");
          card.setAttribute("aria-pressed", "false");
        });
      }

      function setActiveCard(activeIndex) {
        const currentIndex = stage.dataset.activeIndex;

        if (currentIndex === String(activeIndex)) {
          clearActiveCard();
          return;
        }

        stage.dataset.activeIndex = String(activeIndex);
        stage.classList.add("has-active");

        let slotIndex = 0;

        cards.forEach((card, index) => {
          card.classList.remove("is-selected", "is-minimized");

          if (index === activeIndex) {
            card.classList.add("is-selected");
            card.setAttribute("aria-pressed", "true");
            return;
          }

          const slot = collapsedSlots[slotIndex];
          card.classList.add("is-minimized");
          card.dataset.collapsedX = String(slot.x);
          card.style.setProperty("--collapsed-x", `${slot.x}px`);
          card.style.setProperty("--collapsed-angle", slot.angle);
          card.style.setProperty("--collapsed-z", String(slot.z));
          card.setAttribute("aria-pressed", "false");
          slotIndex += 1;
        });
      }

      cards.forEach((card, index) => {
        card.setAttribute("aria-pressed", "false");
        card.addEventListener("click", () => setActiveCard(index));
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          clearActiveCard();
        }
      });
    </script>
  </body>
</html>
